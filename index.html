<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ourivesaria Rinchoa: joalharia, alianças e relojoaria com atendimento presencial na Rinchoa."
    />
    <meta name="theme-color" content="#feefdb" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      if (window.location.pathname === '/') {
        const preload = document.createElement('link')
        preload.rel = 'preload'
        preload.as = 'image'
        preload.href = '/images/store_front-1024.webp'
        preload.setAttribute(
          'imagesrcset',
          '/images/store_front-640.webp 640w, /images/store_front-1024.webp 1024w, /images/store_front.webp 1536w',
        )
        preload.setAttribute('imagesizes', '100vw')
        preload.setAttribute('fetchpriority', 'high')
        document.head.appendChild(preload)
      }
    </script>
    <title>Ourivesaria Rinchoa | Joalharia, alianças e relojoaria na Rinchoa</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
