name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: |
          npm audit --json > audit.json || true
          node -e "const a=require('./audit.json'); const h=a.metadata?.vulnerabilities?.high||0; const c=a.metadata?.vulnerabilities?.critical||0; console.log('Audit summary: high=',h,'critical=',c); if(h>0||c>0){console.error('High/critical vulnerabilities found'); process.exit(1)}"

      - name: Optimize images
        run: npm run images:optimize

      - name: Run checks
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
